name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  COVERAGE_MINIMUM: "35"
  UV_VERSION: "0.12.10"
  VERCEL_CLI_VERSION: "59.12.0"
  IMAGE_NAME: "ghcr.io/mindu2kk/truyen-kieu-chat"
  PRODUCTION_ORIGIN: "https://truyen-kieu-chat.vercel.app"

jobs:
  verify:
    name: Lint, test, coverage, and Django readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint
        run: |
          python -m compileall -q app chat_UI project
          flake8 app chat_UI project --count --select=E9,F63,F7,F82 --show-source --statistics --max-line-length=120
      - name: Test and enforce coverage
        env:
          DJANGO_SETTINGS_MODULE: project.test_settings
          DJANGO_SECRET_KEY: ci-test-secret-not-for-production-9wJ6bRt8mQ2vK5xL
          DEBUG: "0"
          ALLOWED_HOSTS: testserver
          RERANKER: none
        run: |
          pytest tests \
            --cov=app \
            --cov=chat_UI \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --junitxml=junit.xml \
            --cov-fail-under="${COVERAGE_MINIMUM}"
      - name: Verify production Django configuration
        env:
          DJANGO_SECRET_KEY: ci-only-secret
          DEBUG: "0"
          ALLOWED_HOSTS: testserver
          RERANKER: none
        run: python manage.py check --deploy
      - name: Validate Vercel configuration
        run: python -m json.tool vercel.json > /dev/null
      - name: Upload test and coverage reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports-${{ github.sha }}
          path: |
            coverage.xml
            junit.xml
            htmlcov/
          if-no-files-found: warn

  container:
    name: Docker build and smoke test
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build exact-SHA image
        run: docker build --tag "${IMAGE_NAME}:${GITHUB_SHA}" .
      - name: Smoke test Django container
        shell: bash
        run: |
          set -euo pipefail
          container_name="kieu-bot-smoke-${GITHUB_RUN_ID}"
          docker run --detach --name "$container_name" \
            --publish 8000:8000 \
            --env DEBUG=1 \
            --env DJANGO_SECRET_KEY=ci-container-smoke-secret-not-for-production \
            --env ALLOWED_HOSTS=127.0.0.1,localhost \
            --env RERANKER=none \
            "${IMAGE_NAME}:${GITHUB_SHA}" \
            sh -c 'python manage.py migrate --noinput && exec gunicorn project.wsgi:application --bind 0.0.0.0:8000 --workers 1 --threads 2 --timeout 60'

          smoke_ok=0
          for _ in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:8000/accounts/login/ > /dev/null; then
              smoke_ok=1
              break
            fi
            sleep 2
          done
          if [[ "$smoke_ok" != "1" ]]; then
            docker logs "$container_name"
            exit 1
          fi
          test "$(docker inspect --format '{{.State.Running}}' "$container_name")" = "true"
          docker rm --force "$container_name"

  publish-image:
    name: Publish immutable SHA image
    needs: container
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish exact SHA
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}

  staging:
    name: Deploy Vercel preview
    needs: publish-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v7
      - name: Install uv for Vercel Python builds
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Build and deploy preview
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes "vercel@${VERCEL_CLI_VERSION}" whoami --token="$VERCEL_TOKEN"
          npx --yes "vercel@${VERCEL_CLI_VERSION}" pull --yes --environment=preview --token="$VERCEL_TOKEN"
          npx --yes "vercel@${VERCEL_CLI_VERSION}" build --token="$VERCEL_TOKEN"
          url="$(npx --yes "vercel@${VERCEL_CLI_VERSION}" deploy --prebuilt --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          npx --yes "vercel@${VERCEL_CLI_VERSION}" curl /api/health/ \
            --deployment "$url" \
            -- --fail --silent --show-error --retry 5 --retry-delay 2

  production:
    name: Migrate and deploy Vercel production
    needs: staging
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install uv for Vercel Python builds
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install production dependencies
        run: pip install -r requirements.txt
      - name: Migrate and deploy production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes "vercel@${VERCEL_CLI_VERSION}" whoami --token="$VERCEL_TOKEN"
          npx --yes "vercel@${VERCEL_CLI_VERSION}" pull --yes --environment=production --token="$VERCEL_TOKEN"
          previous_url="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v6/deployments?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_ORG_ID}&target=production&state=READY&limit=1" \
            | jq --raw-output '.deployments[0].url // empty')"
          set -a
          source .vercel/.env.production.local
          set +a
          python manage.py migrate --noinput
          npx --yes "vercel@${VERCEL_CLI_VERSION}" build --prod --token="$VERCEL_TOKEN"
          candidate_url="$(npx --yes "vercel@${VERCEL_CLI_VERSION}" deploy --prebuilt --prod --skip-domain --token="$VERCEL_TOKEN")"
          npx --yes "vercel@${VERCEL_CLI_VERSION}" curl /api/health/ \
            --deployment "$candidate_url" \
            -- --fail --silent --show-error --retry 5 --retry-delay 2

          if ! npx --yes "vercel@${VERCEL_CLI_VERSION}" promote "$candidate_url" --yes --token="$VERCEL_TOKEN"; then
            if [[ -n "$previous_url" ]]; then
              npx --yes "vercel@${VERCEL_CLI_VERSION}" rollback "https://${previous_url}" --yes --token="$VERCEL_TOKEN" || true
            fi
            exit 1
          fi

          if ! curl --fail --silent --show-error --retry 8 --retry-delay 3 "${PRODUCTION_ORIGIN}/api/health/"; then
            if [[ -n "$previous_url" ]]; then
              npx --yes "vercel@${VERCEL_CLI_VERSION}" rollback "https://${previous_url}" --yes --token="$VERCEL_TOKEN" || true
            fi
            exit 1
          fi
