[project]
name = "kieu-bot"
version = "0.1.0"
description = "Django RAG chatbot for Truyen Kieu"
requires-python = ">=3.12"
dependencies = [
    "Django>=4.2,<5.1",
    "django-allauth>=0.63",
    "dj-database-url>=2.2",
    "whitenoise>=6.7",
    "pymongo[srv]>=4.6",
    "psycopg[binary]>=3.2",
    "google-generativeai>=0.8,<0.9",
    "google-genai>=1.0,<2",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.9",
    "regex>=2024.7.24",
]

[tool.black]
line-length = 120
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["*/migrations/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "--cov=app",
    "--cov=chat_UI",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=35",
]
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (require external services)",
    "e2e: End-to-end tests (full system)",
    "slow: Tests that take longer than 5 seconds",
    "requires_api: Tests that require external API (Gemini, MongoDB)",
    "requires_db: Tests that require database",
    "requires_mongo: Tests that require MongoDB connection",
]

[tool.coverage.run]
source = ["app", "chat_UI"]
omit = [
    "*/migrations/*",
    "*/venv/*",
    "*/env/*",
    "*/__pycache__/*",
    "*/tests/*",
    "*/test_*.py",
    "*/manage.py",
    "*/settings.py",
    "*/urls.py",
    "*/wsgi.py",
    "*/asgi.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
precision = 2
show_missing = true
skip_covered = false

[tool.vercel]
entrypoint = "project.wsgi:app"

[tool.vercel.scripts]
# Vercel runs this after installing Python dependencies and before the WSGI
# application is deployed. Neon supplies an isolated DATABASE_URL to previews.
build = "python manage.py migrate --noinput && python manage.py bootstrap_superuser"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "migrations",
    "venv",
    ".venv",
    "build",
    "dist",
]

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv", "migrations"]
skips = ["B101", "B601"]  # Skip assert_used, shell_injection_subprocess
