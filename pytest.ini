[pytest]
# Django settings
DJANGO_SETTINGS_MODULE = project.test_settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*

# Test discovery
testpaths = tests

# Options
addopts =
    --verbose
    --strict-markers
    --tb=short
    --cov=app
    --cov=chat_UI
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-fail-under=35
    --durations=10
    --timeout=300

# Markers (custom test markers)
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (require external services)
    e2e: End-to-end tests (full system)
    slow: Tests that take longer than 5 seconds
    requires_api: Tests that require external API (Gemini, MongoDB)
    requires_db: Tests that require database
    requires_mongo: Tests that require MongoDB connection

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Asyncio
asyncio_mode = auto
